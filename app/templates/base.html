<!-- Base Template -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %} It's Game Night {% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/beercss@3.13.3/dist/cdn/beer.min.css" rel="stylesheet">
    <script type="module" src="https://cdn.jsdelivr.net/npm/beercss@3.13.3/dist/cdn/beer.min.js"></script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/material-dynamic-colors@1.1.2/dist/cdn/material-dynamic-colors.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body>
    <div class="container center">
        <header>
            <nav class="center-align" aria-label="Main Navigation">
                <a href="{{ url_for('home') }}" class="button">Home</a>
                <a href="{{ url_for('games') }}" class="button">Games</a>
                <a href="{{ url_for('about') }}" class="button">About</a>
            </nav>
        </header>
        <main>
            {% block content %}
            {% endblock %}
        </main>
    </div>
    <footer class="center-align">
        <p>Created by K Surratt</p>
        <p>
            <a href="https://github.com/deejuh719"><i class="fa fa-github"></i></a>
            <a href="https://www.linkedin.com/in/ksurratt/"><i class="fa fa-linkedin"></i></a>
            <a href=""><i class="fa fa-paper-plane"></i></a>
        </p>
        <p>&copy; 2026 It's Game Night. All rights reserved.</p>
    </footer>
</body>
</html>
