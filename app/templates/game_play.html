{% extends "base.html" %}
{% block title %} Now Playing {{ game.name }} {% endblock %}
{% block content %}
<div class="center middle">
    <h1>Now Playing: {{ game.name }}</h1>
    <h3>Welcome {{ game.players }}!</h3>
    <p><strong>Game Status:</strong> {% if game.state == 'active' % }Active{ % else % }Inactive {% endif %}</p>
    <a href="{{ url_for('games') }}" class="button">Back to Game Selection</a>
</div>
{% endblock %}
